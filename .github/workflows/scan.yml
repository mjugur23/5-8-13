name: 5-8-13 EMA Taraması

on:
  workflow_dispatch:   # cron-job.org bu eventi tetikler

jobs:
  scan:
    runs-on: ubuntu-latest

    steps:
      - name: Repoyu çek
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Gereksinimleri kur
        run: pip install -r requirements.txt

      - name: Taramayı çalıştır
        env:
          TELEGRAM_TOKEN:   ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scanner.py

      - name: Hafızayı kaydet
        run: |
          git config --global user.name  "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add hafiza.json
          git diff --cached --quiet || git commit -m "hafiza guncellendi $(date +'%Y-%m-%d %H:%M')"
          git push
