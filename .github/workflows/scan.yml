name: 5-8-13 EMA Patlama Radarı

on:
  schedule:
    # Hafta içi (Pzt-Cuma) her gün Türkiye saati ile 18:30'da çalışır (UTC 15:30)
    - cron: '30 15 * * 1-5'
  workflow_dispatch: # İstediğin zaman GitHub üzerinden manuel tıklayıp başlatmanı sağlar

jobs:
  tarama-yap:
    runs-on: ubuntu-latest

    steps:
    - name: 📥 Repoyu Klonla (Checkout)
      uses: actions/checkout@v4

    - name: 🐍 Python Kurulumu
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: 📦 Kütüphaneleri Yükle
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    # ÖNEMLİ: Eğer verileri indiren ayrı bir kodun varsa (örn: download.py) 
    # scanner.py'den ÖNCE onu çalıştırmalısın. Yorum satırını kaldırıp dosya adını yazabilirsin.
    # - name: 📊 Güncel Verileri İndir
    #   run: python verileri_indir.py

    - name: 🚀 Taramayı Başlat (Motor)
      run: python scanner.py

    - name: 💾 Sonuçları (JSON) Kaydet ve Pushla
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action Bot"
        git add bot_data/
        # Eğer o gün yeni bir sinyal yoksa ve JSON değişmediyse hata vermemesi için || true ekliyoruz
        git commit -m "🤖 Bot verisi güncellendi (5-8-13 EMA)" || true
        git push
